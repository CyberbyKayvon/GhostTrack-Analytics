version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ghosttrack_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghosttrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghosttrack_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-ghosttrack}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ghosttrack_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: ghosttrack_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ghosttrack}:${POSTGRES_PASSWORD:-ghosttrack_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-ghosttrack}
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=development
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    container_name: ghosttrack_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
